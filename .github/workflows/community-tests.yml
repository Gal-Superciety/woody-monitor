name: Community feature tests
on:
  pull_request:
    paths:
      - 'core/community_updates.py'
      - 'core/multiversx.py'
      - 'tests/test_community_updates.py'
      - '.github/workflows/community-tests.yml'
  workflow_dispatch:
jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q core main.py config.py
      - run: python -m unittest discover -s tests -p 'test_community_updates.py' -v
